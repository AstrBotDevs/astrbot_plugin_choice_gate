name: astrbot_plugin_choice_gate
display_name: Choice Gate
desc: Gates LLM replies with TypeSafe Jev: one request fans out several choice heads, answers are strictly validated, and rejected messages are stopped before the LLM request is queued.
short_desc: Decide by choice probability whether a message reaches the LLM.
